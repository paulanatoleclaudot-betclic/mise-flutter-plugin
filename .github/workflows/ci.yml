name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_REF: 27fec0e365a374f1d9c1ffb24b57b4fc69966c9a
  FLUTTER_STABLE: 3.47.3
  MISE_YES: 1

jobs:
  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: false
      - name: link the plugin from this checkout
        run: |
          mise plugins link flutter-git "$GITHUB_WORKSPACE"
          echo "FLUTTER_BIN=${{ runner.os == 'Windows' && 'flutter.bat' || 'flutter' }}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/proj"

      - name: ls-remote lists stable versions
        run: |
          out="$(mise ls-remote flutter-git)"
          echo "$out" | tail -5
          echo "$out" | grep -qx "$FLUTTER_STABLE" || { echo "expected $FLUTTER_STABLE in ls-remote"; exit 1; }

      - name: install from a git ref
        working-directory: ${{ runner.temp }}/proj
        run: |
          printf '[tools]\nflutter-git = "ref:%s"\n' "$FLUTTER_REF" > mise.toml
          mise trust -q
          mise install
          head="$(git -C "$(mise where flutter-git)" rev-parse HEAD)"
          [ "$head" = "$FLUTTER_REF" ] || { echo "HEAD is $head, expected $FLUTTER_REF"; exit 1; }
          mise exec -- "$FLUTTER_BIN" --version
          machine="$(mise exec -- "$FLUTTER_BIN" --version --machine)"
          echo "$machine" | grep -q "\"frameworkRevision\": \"$FLUTTER_REF\"" || { echo "wrong framework revision"; exit 1; }
          echo "$machine" | grep -q '"frameworkVersion": "0.0.0-unknown"' && { echo "version not derived from tags"; exit 1; }
          true

      - name: install a stable release
        working-directory: ${{ runner.temp }}/proj
        run: |
          printf '[tools]\nflutter-git = "%s"\n' "$FLUTTER_STABLE" > mise.toml
          mise install
          mise exec -- "$FLUTTER_BIN" --version | tee version.txt
          grep -q "^Flutter $FLUTTER_STABLE " version.txt

      - name: core flutter is not hijacked
        working-directory: ${{ runner.temp }}/proj
        run: |
          printf '[tools]\nflutter-git = "%s"\nflutter = "%s"\n' "$FLUTTER_STABLE" "$FLUTTER_STABLE" > mise.toml
          mise tool flutter | tee tool.txt
          grep -Eq '^Backend:[[:space:]]+http:flutter' tool.txt
