name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck bin/* lib/*.bash

  smoke:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: list-all returns versions
        run: |
          out="$(./bin/list-all)"
          echo "$out" | tr ' ' '\n' | tail -5
          echo "$out" | grep -q '3.22.1' || { echo "expected 3.22.1 in list-all"; exit 1; }
          echo "$out" | grep -q 'stable' && { echo "version list should not carry -stable suffix"; exit 1; }
          true
      - name: latest-stable resolves
        run: test -n "$(./bin/latest-stable)"
